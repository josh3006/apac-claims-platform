spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/claims}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # Only enable for a backed-up, reviewed legacy schema. Fresh databases need no baseline.
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
    clean-disabled: true
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  events-enabled: ${EVENTS_ENABLED:false}
  claimant-password: ${CLAIMANT_PASSWORD:claimant-demo}
  officer-password: ${OFFICER_PASSWORD:officer-demo}
